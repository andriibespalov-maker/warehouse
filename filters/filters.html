<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Advanced Filter Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-primary { background-color: #4C4993; }
    .bg-primary-hover { background-color: #3f3c7d; }
    .text-primary { color: #4C4993; }
    .border-primary { border-color: #4C4993; }
  </style>
</head>
<body class="bg-gray-900/40 backdrop-blur-xs min-h-screen flex items-center justify-center p-4">

<!-- Головне модальне вікно (Wide Modal) -->
<div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-200 max-h-[90vh]">

  <!-- Header модалки -->
  <div class="px-6 py-3.5 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
    <div class="flex items-center gap-2.5">
      <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
      <h2 class="text-base font-bold text-gray-900">Фільтрувати</h2>
    </div>
    <button class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Двоколонковий контент -->
  <div class="flex-1 flex overflow-hidden">

    <!-- ЛІВА КОЛОНКА: Пресети (260px) -->
    <div class="w-64 border-r border-gray-200 bg-slate-50/70 p-4 flex flex-col justify-between shrink-0">
      <div class="space-y-4">

        <!-- Системні пресети -->
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 px-1">Системні</span>
          <div class="mt-1.5 space-y-1">
            <div class="px-3 py-2 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-200/60 cursor-pointer transition-colors flex items-center justify-between">
              <span>За замовчуванням</span>
              <span class="text-[10px] bg-gray-200 px-1.5 py-0.2 rounded text-gray-600">DEF</span>
            </div>
          </div>
        </div>

        <!-- Мої збережені пресети -->
        <div>
          <div class="flex justify-between items-center px-1 mb-1.5">
            <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Мої шаблони</span>
            <span class="text-[10px] text-gray-400 font-semibold">3</span>
          </div>

          <div class="space-y-1">
            <!-- Активний пресет -->
            <div class="group px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-50/90 border border-primary/30 text-primary flex items-center justify-between shadow-2xs cursor-pointer">
              <span class="truncate">Мої активні угоди</span>
              <svg class="w-3.5 h-3.5 text-primary shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            </div>

            <!-- Звичайні пресети -->
            <div class="group px-3 py-2 rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-200/60 flex items-center justify-between cursor-pointer transition-colors">
              <span class="truncate">Очікують оплати ($)</span>
              <div class="hidden group-hover:flex items-center gap-1 text-gray-400">
                <button class="hover:text-primary"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
                <button class="hover:text-red-600"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
              </div>
            </div>

            <div class="group px-3 py-2 rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-200/60 flex items-center justify-between cursor-pointer transition-colors">
              <span class="truncate">Китай / Море</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Створення пресету -->
      <button class="w-full py-2 px-3 border border-dashed border-gray-300 hover:border-primary text-gray-600 hover:text-primary rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors bg-white">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Зберегти як шаблон
      </button>
    </div>

    <!-- ПРАВА КОЛОНКА: Конструктор умов (Flex-1) -->
    <div class="flex-1 p-5 overflow-y-auto flex flex-col justify-between space-y-4">

      <div>
        <!-- Тулбар дій над полями -->
        <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">Умови фільтрації</h3>

          <div class="flex items-center gap-2">
            <button class="px-2.5 py-1 bg-indigo-50 text-primary hover:bg-indigo-100 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
              Додати поле
            </button>
            <button class="px-2.5 py-1 text-gray-500 hover:text-gray-800 text-xs font-medium hover:bg-gray-100 rounded-lg transition-colors">
              Очистити значення
            </button>
            <button class="px-2.5 py-1 text-gray-400 hover:text-red-600 text-xs font-medium hover:bg-red-50 rounded-lg transition-colors">
              Скинути все
            </button>
          </div>
        </div>

        <!-- Сітка полів умови (Табличний формат високої щільності) -->
        <div class="space-y-2">

          <!-- Рядок 1: Текстове поле (Назва) -->
          <div class="group grid grid-cols-12 items-center gap-2 p-1.5 rounded-lg border border-gray-200/80 hover:border-gray-300 hover:bg-slate-50/50 transition-all">
            <div class="col-span-3 flex items-center gap-1.5 pl-1">
              <span class="text-gray-300 group-hover:text-gray-400 cursor-grab text-xs">⋮⋮</span>
              <span class="text-xs font-semibold text-gray-700 truncate">Назва угоди</span>
            </div>
            <div class="col-span-3">
              <select class="w-full bg-white border border-gray-200 text-gray-700 text-xs rounded-md p-1.5 outline-none focus:border-primary">
                <option>Містить</option>
                <option>Дорівнює</option>
                <option>Починається з</option>
              </select>
            </div>
            <div class="col-span-5">
              <input type="text" placeholder="Введіть текст..." value="e2e-probe" class="w-full bg-white border border-gray-200 text-gray-800 text-xs rounded-md p-1.5 outline-none focus:border-primary">
            </div>
            <div class="col-span-1 text-right pr-1">
              <button class="text-gray-300 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
          </div>

          <!-- Рядок 2: Числовий ідентифікатор (DF номер) -->
          <div class="group grid grid-cols-12 items-center gap-2 p-1.5 rounded-lg border border-gray-200/80 hover:border-gray-300 hover:bg-slate-50/50 transition-all">
            <div class="col-span-3 flex items-center gap-1.5 pl-1">
              <span class="text-gray-300 group-hover:text-gray-400 cursor-grab text-xs">⋮⋮</span>
              <span class="text-xs font-semibold text-gray-700 truncate">DF номер</span>
            </div>
            <div class="col-span-3">
              <select class="w-full bg-white border border-gray-200 text-gray-700 text-xs rounded-md p-1.5 outline-none focus:border-primary">
                <option>Містить</option>
                <option>Дорівнює</option>
              </select>
            </div>
            <div class="col-span-5">
              <input type="text" placeholder="DF-XXXX" class="w-full bg-white border border-gray-200 text-gray-800 text-xs rounded-md p-1.5 outline-none focus:border-primary">
            </div>
            <div class="col-span-1 text-right pr-1">
              <button class="text-gray-300 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
          </div>

          <!-- Рядок 3: Мультиселект (Типи угод) -->
          <div class="group grid grid-cols-12 items-center gap-2 p-1.5 rounded-lg border border-gray-200/80 hover:border-gray-300 hover:bg-slate-50/50 transition-all">
            <div class="col-span-3 flex items-center gap-1.5 pl-1">
              <span class="text-gray-300 group-hover:text-gray-400 cursor-grab text-xs">⋮⋮</span>
              <span class="text-xs font-semibold text-gray-700 truncate">Типи угод</span>
            </div>
            <div class="col-span-3">
              <select class="w-full bg-white border border-gray-200 text-gray-700 text-xs rounded-md p-1.5 outline-none">
                <option>Один із списку</option>
                <option>Окрім</option>
              </select>
            </div>
            <div class="col-span-5">
              <div class="bg-white border border-gray-200 rounded-md p-1 flex flex-wrap items-center gap-1 min-h-[30px]">
                  <span class="bg-indigo-50 text-primary text-[11px] font-medium px-1.5 py-0.2 rounded flex items-center gap-1">
                    Викуп <button class="hover:text-red-500 font-bold">×</button>
                  </span>
                <input type="text" placeholder="+ Обрати" class="text-xs text-gray-500 outline-none flex-1 min-w-[50px] px-1">
              </div>
            </div>
            <div class="col-span-1 text-right pr-1">
              <button class="text-gray-300 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
          </div>

          <!-- Рядок 4: Залежне поле (Статуси) -->
          <div class="group grid grid-cols-12 items-center gap-2 p-1.5 rounded-lg border border-indigo-200 bg-indigo-50/20 transition-all">
            <div class="col-span-3 flex items-center gap-1.5 pl-1">
              <span class="text-gray-300 group-hover:text-gray-400 cursor-grab text-xs">⋮⋮</span>
              <div>
                <span class="text-xs font-semibold text-gray-800 block truncate">Статуси</span>
                <span class="text-[9px] text-indigo-600 block">для «Викуп»</span>
              </div>
            </div>
            <div class="col-span-3">
              <select class="w-full bg-white border border-gray-200 text-gray-700 text-xs rounded-md p-1.5 outline-none">
                <option>Один із списку</option>
              </select>
            </div>
            <div class="col-span-5">
              <select class="w-full bg-white border border-gray-200 text-gray-800 text-xs rounded-md p-1.5 outline-none focus:border-primary">
                <option>Очікує оплати</option>
                <option>Прорахунок викупу</option>
              </select>
            </div>
            <div class="col-span-1 text-right pr-1">
              <button class="text-gray-300 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
          </div>

          <!-- Рядок 5: Сума / Діапазон (Дебіторка) -->
          <div class="group grid grid-cols-12 items-center gap-2 p-1.5 rounded-lg border border-gray-200/80 hover:border-gray-300 hover:bg-slate-50/50 transition-all">
            <div class="col-span-3 flex items-center gap-1.5 pl-1">
              <span class="text-gray-300 group-hover:text-gray-400 cursor-grab text-xs">⋮⋮</span>
              <span class="text-xs font-semibold text-gray-700 truncate">Дебіторка ($)</span>
            </div>
            <div class="col-span-3">
              <select class="w-full bg-white border border-gray-200 text-gray-700 text-xs rounded-md p-1.5 outline-none">
                <option>Діапазон</option>
                <option>Більше ніж</option>
              </select>
            </div>
            <div class="col-span-5 flex items-center gap-1">
              <input type="number" placeholder="Від" class="w-1/2 bg-white border border-gray-200 text-gray-800 text-xs rounded-md p-1.5 outline-none focus:border-primary">
              <span class="text-gray-300 text-xs">—</span>
              <input type="number" placeholder="До" class="w-1/2 bg-white border border-gray-200 text-gray-800 text-xs rounded-md p-1.5 outline-none focus:border-primary">
            </div>
            <div class="col-span-1 text-right pr-1">
              <button class="text-gray-300 hover:text-red-500 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
          </div>

        </div>
      </div>

      <!-- Поворот до замовчування + Інфо підказка -->
      <div class="pt-2 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400">
        <span>Застосовано 5 умов фільтрації</span>
        <button class="text-primary hover:underline font-medium">Повернути за замовчуванням</button>
      </div>

    </div>

  </div>

  <!-- Footer модалки -->
  <div class="px-6 py-3.5 bg-gray-50 border-t border-gray-200 flex justify-end items-center gap-3 shrink-0">
    <button class="px-4 py-2 border border-gray-300 hover:bg-gray-100 text-gray-700 text-xs font-semibold rounded-xl transition-colors">
      Скасувати
    </button>
    <button class="px-6 py-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold rounded-xl shadow-sm transition-colors flex items-center gap-2">
      <span>Підтвердити та застосувати</span>
    </button>
  </div>

</div>

</body>
</html>
