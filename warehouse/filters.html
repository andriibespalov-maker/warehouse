<!-- ============================================================ -->
<!-- ПАНЕЛЬ РЕЖИМУ ПЕРЕГЛЯДУ — завжди видима, незалежно від режиму -->
<!-- ============================================================ -->
<div id="view-mode-bar" class="flex flex-wrap items-center justify-between gap-3 px-1">
  <!-- Ліва частина: Перемикач режиму -->
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Режим перегляду:</span>
    <div class="flex items-center bg-slate-100 p-0.5 rounded-xl border border-slate-200">
      <button type="button" id="btn-view-mode-list"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-slate-800 shadow-xs flex items-center gap-1.5 cursor-pointer select-none">
        <i class="fa-solid fa-list text-slate-500"></i>
        <span>Список</span>
      </button>
      <button type="button" id="btn-toggle-grouping"
        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center gap-1.5 cursor-pointer select-none">
        <i class="fa-solid fa-layer-group text-indigo-500"></i>
        <span id="grouping-btn-text">Групувати за перевезенням</span>
      </button>
    </div>
  </div>

  <!-- Права частина: Кнопка "Додати Єрайв" — завжди видима -->
  <button id="btn-add-arrive" type="button"
    class="group inline-flex items-center gap-2 h-9 px-4 rounded-xl text-xs font-bold text-indigo-950 bg-indigo-50 hover:bg-indigo-600 hover:text-white border border-indigo-200/80 hover:border-indigo-600 shadow-xs hover:shadow-md hover:shadow-indigo-500/20 active:scale-[0.98] transition-all duration-200 cursor-pointer shrink-0">
    <i class="fa-solid fa-plus text-xs text-indigo-600 group-hover:text-white transition-transform duration-200 group-hover:scale-110"></i>
    <span>Додати Єрайв</span>
  </button>
</div>

<!-- ============================================================ -->
<!-- ФІЛЬТРИ СПИСКУ — видимі ТІЛЬКИ в режимі "Список"            -->
<!-- ============================================================ -->
<!-- Status Group Tabs & Toolbar -->
<section id="list-view-filters" class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-4 space-y-4">
  <!-- Status Group Segmented Control Track -->
  <div class="flex items-center justify-between border-b border-slate-100 pb-3.5 flex-wrap gap-3">
    <div
      class="inline-flex items-center gap-1.5 p-1 bg-slate-100/80 rounded-2xl border border-slate-200/60 w-full sm:w-auto overflow-x-auto custom-scrollbar">

      <!-- 1. На складі -->
      <button type="button" data-status-group="on_warehouse"
        class="status-group-tab px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer select-none whitespace-nowrap">
        <i class="fa-solid fa-warehouse text-xs opacity-80"></i>
        <span>На складі</span>
        <span id="badge-count-on_warehouse"
          class="badge-count px-2 py-0.5 rounded-full text-[10px] font-extrabold tracking-tight transition-colors">0</span>
      </button>

      <!-- 2. Отримано непромаркованим (Нейтральний стиль) -->
      <button type="button" data-status-group="unmarked"
        class="status-group-tab px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer select-none whitespace-nowrap">
        <i class="fa-solid fa-tag text-xs opacity-80"></i>
        <span>Отримано непромаркованим</span>
        <span id="badge-count-unmarked"
          class="badge-count px-2 py-0.5 rounded-full text-[10px] font-extrabold tracking-tight transition-colors">0</span>
      </button>

      <!-- 3. Очікування прибуття -->
      <button type="button" data-status-group="awaiting_arrival"
        class="status-group-tab px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer select-none whitespace-nowrap">
        <i class="fa-solid fa-plane-arrival text-xs opacity-80"></i>
        <span>Очікування прибуття</span>
        <span id="badge-count-awaiting_arrival"
          class="badge-count px-2 py-0.5 rounded-full text-[10px] font-extrabold tracking-tight transition-colors">0</span>
      </button>

      <button type="button" data-status-group="last_mile"
        class="status-group-tab px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer select-none whitespace-nowrap">
        <i class="fa-solid fa-truck-ramp-box text-xs opacity-80"></i>
        <span>Остання миля</span>
        <span id="badge-count-last_mile"
          class="badge-count px-2 py-0.5 rounded-full text-[10px] font-extrabold tracking-tight transition-colors">0</span>
      </button>

      <!-- 4. Архів -->
      <button type="button" data-status-group="archive"
        class="status-group-tab px-3.5 py-2 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer select-none whitespace-nowrap">
        <i class="fa-solid fa-box-archive text-xs opacity-80"></i>
        <span>Архів</span>
        <span id="badge-count-archive"
          class="badge-count px-2 py-0.5 rounded-full text-[10px] font-extrabold tracking-tight transition-colors">0</span>
      </button>

    </div>
  </div>

  <!-- Filters Toolbar -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <!-- Left Section -->
    <div class="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
      <!-- Quick Search Input -->
      <div class="relative flex-1 min-w-[200px] max-w-xs">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="Пошук..."
          class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
      </div>

      <!-- Кнопка відкриття Модалки Фільтрів -->
      <button type="button" id="btn-open-advanced-filter"
        class="relative inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3.5 py-2 rounded-xl transition text-xs font-bold cursor-pointer shadow-2xs">
        <i class="fa-solid fa-filter text-indigo-600"></i>
        <span>Розширений фільтр</span>
        <span id="filter-badge" class="hidden w-2 h-2 bg-indigo-600 rounded-full animate-ping"></span>
      </button>

      <!-- Reset Filters Button -->
      <button type="button" id="btn-reset-filters"
        class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-300 transition text-xs font-semibold select-none cursor-pointer">
        <i class="fa-solid fa-rotate-left text-slate-500"></i>
        <span>Скинути все</span>
      </button>

      <!-- Settings Button -->
      <button type="button" id="btn-cargo-settings"
        class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl border border-slate-300 transition text-xs font-semibold select-none cursor-pointer">
        <i class="fa-solid fa-table-columns text-slate-500"></i>
        <span>Колонки</span>
      </button>
    </div>

    <!-- Right Section: Action Buttons -->
    <div class="flex items-center gap-2">
    </div>
  </div>

  <!-- Active Filters Bar -->
  <div id="active-filters-bar"
    class="hidden pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs">
    <div class="flex items-center gap-2 flex-wrap flex-1">
      <span class="text-slate-400 font-bold uppercase text-[10px] tracking-wider">Активні умови:</span>

      <div id="active-template-badge"
        class="hidden items-center gap-1.5 px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg border border-indigo-200 font-bold text-xs">
        <i class="fa-solid fa-bookmark text-indigo-600"></i>
        <span id="active-template-name-text">Шаблон</span>
      </div>

      <div id="active-chips-container" class="flex items-center gap-2 flex-wrap"></div>
    </div>

    <button type="button" id="clear-all-active-chips"
      class="text-rose-600 hover:text-rose-800 font-bold text-xs flex items-center gap-1 transition cursor-pointer">
      <i class="fa-solid fa-xmark"></i> Скинути
    </button>
  </div>
</section>


<!-- MODAL: РОЗШИРЕНИЙ ФІЛЬТР -->
<div id="modal-advanced-filter"
  class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
  <div
    class="bg-white rounded-3xl shadow-2xl max-w-5xl w-full overflow-hidden flex flex-col max-h-[90vh] border border-slate-100">

    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
          <i class="fa-solid fa-filter text-base"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800">Розширений фільтр</h3>
      </div>
      <button type="button"
        class="close-modal text-slate-400 hover:text-slate-600 text-2xl font-light cursor-pointer">&times;</button>
    </div>

    <!-- Modal Content: 2 Columns -->
    <div class="flex flex-1 min-h-0 divide-x divide-slate-100 overflow-hidden">

      <!-- LEFT COLUMN: Шаблони фільтрів -->
      <div class="w-80 bg-slate-50/50 p-6 flex flex-col justify-between shrink-0 overflow-y-auto custom-scrollbar">
        <div class="space-y-4">
          <div>
            <h4 class="text-xs font-bold text-slate-800 uppercase tracking-wider">ШАБЛОНИ ФІЛЬТРІВ</h4>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">Обирайте готовий шаблон або створюйте власний для
              швидкого фільтрування</p>
          </div>

          <!-- Список шаблонів -->
          <div id="saved-templates-list" class="space-y-2.5"></div>
        </div>

        <button type="button" id="btn-open-save-template"
          class="w-full mt-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Створити шаблон</span>
        </button>
      </div>

      <!-- RIGHT COLUMN: Умови фільтрації -->
      <div class="flex-1 p-6 flex flex-col bg-white overflow-hidden">

        <!-- Верхня зафіксована частина -->
        <div class="flex items-center justify-between pb-4 shrink-0">
          <h4 class="text-base font-bold text-slate-800">Умови фільтра</h4>
          <div class="flex items-center gap-2">
            <button type="button" id="add-filter-btn"
              class="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-plus text-xs"></i> Додати поля
            </button>
            <button type="button" id="clear-filter-fields-btn"
              class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition cursor-pointer">
              Очистити поля
            </button>
          </div>
        </div>

        <!-- Прокручуваний список умов -->
        <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-3">
          <div id="filter-fields-container" class="space-y-3">
            <!-- Картки рендеряться динамічно з JS -->
          </div>
        </div>

        <!-- Зафіксований нижній блок кнопок "Скинути" та "Застосувати" -->
        <div class="flex items-center justify-end gap-3 pt-4 mt-2 border-t border-slate-100 bg-white shrink-0">
          <button type="button" id="close-filter-btn"
            class="px-6 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-semibold transition cursor-pointer">
            Скинути
          </button>
          <button type="button" id="apply-modal-filters"
            class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition cursor-pointer">
            Застосувати
          </button>
        </div>

      </div>

    </div>

  </div>
</div>

<!-- Modal: Add Filter Field -->
<div id="modal-add-filter-field"
  class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-4 border border-slate-100">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h4 class="text-sm font-bold text-slate-800">Оберіть поле для додавання</h4>
      <button type="button"
        class="close-modal-field text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">&times;</button>
    </div>
    <div id="missing-fields-list" class="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar"></div>
  </div>
</div>

<!-- Modal: Save Template -->
<div id="modal-save-template"
  class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 space-y-4 border border-slate-100">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h4 class="text-sm font-bold text-slate-800">Зберегти шаблон фільтрації</h4>
      <button type="button"
        class="close-modal-tpl text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">&times;</button>
    </div>
    <form id="form-save-template" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Назва шаблону <span
            class="text-rose-500">*</span></label>
        <input type="text" id="input-template-name" placeholder="Наприклад: Авіа з Китаю" required
          class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div id="template-conditions-preview"
        class="p-2.5 bg-slate-50 rounded-xl border border-slate-200/80 space-y-1 text-xs"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button"
          class="close-modal-tpl px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300 transition">Скасувати</button>
        <button type="submit"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition">Зберегти</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Edit Template Name -->
<div id="modal-edit-template"
  class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[70] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 space-y-4 border border-slate-100">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h4 class="text-sm font-bold text-slate-800">Редагувати шаблон</h4>
      <button type="button"
        class="close-modal-edit-tpl text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">&times;</button>
    </div>
    <form id="form-edit-template" class="space-y-3">
      <input type="hidden" id="edit-template-id" value="">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Нова назва шаблону <span
            class="text-rose-500">*</span></label>
        <input type="text" id="input-edit-template-name" required
          class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button"
          class="close-modal-edit-tpl px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-300 transition">Скасувати</button>
        <button type="submit"
          class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition">Зберегти</button>
      </div>
    </form>
  </div>
</div>
