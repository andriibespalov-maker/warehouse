<!-- Modal: Settings (Редагування таблиці) -->
<div id="modal-settings" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center text-primary">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gear text-lg"></i>
                <h3 class="font-medium text-lg">Редагування таблиці</h3>
            </div>
            <button class="close-modal text-slate-400 hover:text-slate-600 px-2 text-xl">&times;</button>
        </div>
        <div class="p-5 flex-1">

            <div class="mb-4">
                <button class="text-blue-50 text-sm flex items-center gap-2 bg-blue-50 w-full p-2.5 rounded-lg border border-blue-100 text-blue-500"><i class="fa-solid fa-rotate-right"></i> Відновити за замовчуванням</button>
            </div>
            <div class="space-y-3">
                <div class="flex items-center justify-between text-sm text-slate-500 border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bars text-slate-300"></i> Назва</div>
                    <input type="checkbox" checked disabled class="custom-checkbox opacity-50">
                </div>
                <div class="flex items-center justify-between text-sm text-primary border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bars text-slate-300"></i> Країна</div>
                    <input type="checkbox" checked class="custom-checkbox">
                </div>
                <div class="flex items-center justify-between text-sm text-primary border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bars text-slate-300"></i> Місто</div>
                    <input type="checkbox" checked class="custom-checkbox">
                </div>
                <div class="flex items-center justify-between text-sm text-primary border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-bars text-slate-300"></i> Адреса</div>
                    <input type="checkbox" checked class="custom-checkbox">
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
            <button class="cancel-btn px-4 py-2 bg-white border border-slate-200 text-primary rounded-lg text-sm">Скасувати</button>
            <button class="px-4 py-2 bg-primary text-white rounded-lg text-sm">Підтвердити</button>
        </div>
    </div>
</div>

<!-- Modal: Create Warehouse (Створити склад) -->
<div id="modal-create" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center text-primary">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-lg"></i>
                <h3 class="font-medium text-lg">Створити склад</h3>
            </div>
            <button class="close-modal text-slate-400 hover:text-slate-600 px-2 text-xl">&times;</button>
        </div>
        <div class="p-6 flex-1 space-y-4 max-h-[70vh] overflow-y-auto">
            <div>
                <label class="block text-primary text-sm mb-1">Назва складу <span class="text-red-500">*</span></label>
                <input type="text" placeholder="Назва складу" class="w-full border border-blue-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block text-primary text-sm mb-1">Країна <span class="text-red-500">*</span></label>
                <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm text-slate-500 focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>Оберіть зі списку</option>
                </select>
            </div>
            <div>
                <label class="block text-primary text-sm mb-1">Місто <span class="text-red-500">*</span></label>
                <input type="text" placeholder="Місто" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block text-primary text-sm mb-1">Адреса <span class="text-red-500">*</span></label>
                <input type="text" placeholder="Адреса" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block text-primary text-sm mb-1">Тип складу <span class="text-red-500">*</span></label>
                <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm text-primary focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>Difreight</option>
                </select>
            </div>
            <div>
                <label class="block text-primary text-sm mb-1">Статус <span class="text-red-500">*</span></label>
                <select class="w-full border border-slate-200 rounded-lg p-2.5 text-sm text-primary focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>Активний</option>
                </select>
            </div>
            <div class="flex items-center gap-2 mt-4">
                <input type="checkbox" class="custom-checkbox">
                <span class="text-sm text-primary">Склад Fulfillment</span>
            </div>
        </div>
        <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50">
            <button class="cancel-btn px-4 py-2 bg-white border border-slate-200 text-primary rounded-lg text-sm">Скасувати</button>
            <button class="px-4 py-2 bg-primary text-white rounded-lg text-sm">Підтвердити</button>
        </div>
    </div>
</div>

<!-- Modal: Filter (Фільтрувати) -->
<div id="modal-filter" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col min-h-[400px]">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center text-primary">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-filter text-lg"></i>
                <h3 class="font-medium text-lg">Фільтрувати</h3>
            </div>
            <button class="close-modal text-slate-400 hover:text-slate-600 px-2 text-xl">&times;</button>
        </div>
        <div class="flex flex-1">
            <!-- Sidebar -->
            <div class="w-1/3 bg-slate-50 p-5 border-r border-slate-100">
                <h4 class="font-medium text-primary mb-2">Збережені фільтри</h4>
                <p class="text-primary font-medium text-sm mb-1">Немає збережених фільтрів</p>
                <p class="text-primary text-xs mb-4">Додайте перший, щоб швидко застосовувати збережені умови пошуку</p>
                <button class="bg-primary text-white text-sm py-2 px-4 rounded-lg w-full flex items-center justify-center gap-2"><i class="fa-solid fa-plus"></i> Додати фільтр</button>
            </div>
            <!-- Main Form -->
            <div class="w-2/3 p-5">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-medium text-primary text-lg">Умови фільтра</h4>
                    <div class="flex gap-2 text-xs">
                        <button class="bg-blue-500 text-white px-3 py-1.5 rounded flex items-center gap-1"><i class="fa-solid fa-plus"></i> Додати поля</button>
                        <button class="bg-slate-100 text-slate-500 px-3 py-1.5 rounded border border-slate-200">Очистити поля</button>
                        <button class="bg-slate-100 text-slate-500 px-3 py-1.5 rounded border border-slate-200">Повернути за замовчуванням</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bars text-slate-300"></i>
                        <div class="flex-1">
                            <label class="block text-primary text-xs mb-1">Тип</label>
                            <select class="w-full border border-slate-200 rounded p-2 text-sm text-slate-500 focus:outline-none"><option></option></select>
                        </div>
                        <i class="fa-regular fa-trash-can text-red-400 mt-5"></i>
                    </div>

                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bars text-slate-300"></i>
                        <div class="flex-1">
                            <label class="block text-primary text-xs mb-1">Дата видалення</label>
                            <div class="relative">
                                <i class="fa-regular fa-calendar absolute left-3 top-2.5 text-slate-400"></i>
                                <input type="text" placeholder="Вибір дати" class="w-full border border-slate-200 rounded p-2 pl-9 text-sm text-slate-500 focus:outline-none">
                            </div>
                        </div>
                        <i class="fa-regular fa-trash-can text-red-400 mt-5"></i>
                    </div>

                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-bars text-slate-300"></i>
                        <div class="w-1/3">
                            <label class="block text-primary text-xs mb-1">Умова</label>
                            <select class="w-full border border-slate-200 rounded p-2 text-sm text-primary focus:outline-none"><option>Дорівнює</option></select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-primary text-xs mb-1">Країна</label>
                            <select class="w-full border border-slate-200 rounded p-2 text-sm text-slate-400 focus:outline-none"><option>+ Додати</option></select>
                        </div>
                        <i class="fa-regular fa-trash-can text-red-400 mt-5"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-white">
            <button class="cancel-btn px-4 py-2 bg-white border border-slate-200 text-primary rounded-lg text-sm">Скасувати</button>
            <button class="px-4 py-2 bg-indigo-50 text-indigo-200 rounded-lg text-sm cursor-not-allowed">Підтвердити</button>
        </div>
    </div>
</div>
